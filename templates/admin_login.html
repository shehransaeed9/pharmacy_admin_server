{% extends 'admin_base.html' %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="card p-4 col-md-4 mx-auto mt-5">
  <div class="text-center mb-3">
    <span class="d-inline-flex align-items-center justify-content-center rounded-3 mb-2" style="width:44px;height:44px;background:var(--brand);color:#fff;font-size:1.2rem;"><i class="bi bi-shield-lock-fill"></i></span>
    <h4 class="mb-0">MedInventory Admin</h4>
    <p class="text-muted small mb-0">Sign in to manage subscriptions and pharmacies</p>
  </div>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button class="btn btn-primary w-100">Sign In</button>
  </form>
</div>
{% endblock %}
